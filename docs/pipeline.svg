<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="MultiHop Fact Verification"><title>MultiHop Fact Verification</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a9cc"/></marker></defs><rect width="1200" height="640" rx="18" fill="#0f1020"/><text x="40" y="48" font-size="22" font-weight="700" fill="#e8eaf6">MultiHop Fact Verification</text><text x="40" y="72" font-size="13.5" fill="#a3a9cc">Sparse retrieval, dense reranking and NLI verification on HoVer claims over Wikipedia</text><rect x="40" y="96" width="1120" height="214" rx="14" fill="#161933" stroke="#2b3060"/><text x="60" y="124" font-size="11" fill="#6f76a3" font-weight="700" text-anchor="start">PIPELINE, RUN PER CLAIM</text><rect x="64" y="140" width="236" height="112" rx="10" fill="#64748b" fill-opacity=".12" stroke="#64748b" stroke-width="1.5"/><rect x="64" y="150" width="4" height="92" rx="2" fill="#64748b"/><text x="82" y="166" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">HoVer claim</text><text x="82" y="188" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">A claim that needs evidence</text><text x="82" y="206" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">from 2 to 4 Wikipedia</text><text x="82" y="224" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">articles to verify</text><rect x="340" y="140" width="236" height="112" rx="10" fill="#3b82f6" fill-opacity=".12" stroke="#3b82f6" stroke-width="1.5"/><rect x="340" y="150" width="4" height="92" rx="2" fill="#3b82f6"/><text x="358" y="166" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">BM25 retrieval</text><text x="358" y="188" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Elasticsearch index over</text><text x="358" y="206" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">5.4M Wikipedia articles</text><text x="358" y="224" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Returns top 100 docs</text><rect x="616" y="140" width="236" height="112" rx="10" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-width="1.5"/><rect x="616" y="150" width="4" height="92" rx="2" fill="#8b5cf6"/><text x="634" y="166" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Dense reranking</text><text x="634" y="188" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Sentence BERT bi encoder</text><text x="634" y="206" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">multi-qa-mpnet-base-dot-v1</text><text x="634" y="224" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Rescores, keeps top 10</text><rect x="892" y="140" width="236" height="112" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-width="1.5"/><rect x="892" y="150" width="4" height="92" rx="2" fill="#10b981"/><text x="910" y="166" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">NLI verification</text><text x="910" y="188" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">roberta-large-mnli scores</text><text x="910" y="206" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">the aggregated evidence</text><text x="910" y="224" font-size="12.5" fill="#a3a9cc" font-weight="400" text-anchor="start">Threshold tuned to 0.05</text><path d="M304,196.0 L334,196.0" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><path d="M580,196.0 L610,196.0" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><path d="M856,196.0 L886,196.0" fill="none" stroke="#a3a9cc" stroke-width="1.8" marker-end="url(#ah)"/><rect x="910" y="268" width="82.8" height="26" rx="13" fill="#10b981" fill-opacity=".18" stroke="#10b981"/><text x="951.4" y="285.5" font-size="12" fill="#10b981" font-weight="700" text-anchor="middle">SUPPORTED</text><rect x="1002.8" y="268" width="115.6" height="26" rx="13" fill="#ef4444" fill-opacity=".18" stroke="#ef4444"/><text x="1060.6" y="285.5" font-size="12" fill="#ef4444" font-weight="700" text-anchor="middle">NOT SUPPORTED</text><rect x="40" y="336" width="1120" height="264" rx="14" fill="#161933" stroke="#2b3060"/><text x="60" y="364" font-size="11" fill="#6f76a3" font-weight="700" text-anchor="start">RESULTS ON THE HOVER DEV SET</text><rect x="580" y="350" width="12" height="12" rx="3" fill="#64748b"/><text x="598" y="360" font-size="12" fill="#a3a9cc" font-weight="400" text-anchor="start">BM25 only</text><rect x="690" y="350" width="12" height="12" rx="3" fill="#8b5cf6"/><text x="708" y="360" font-size="12" fill="#a3a9cc" font-weight="400" text-anchor="start">BM25 + dense rerank</text><text x="64" y="406" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Recall@10</text><text x="64" y="424" font-size="12" fill="#6f76a3" font-weight="400" text-anchor="start">retrieval</text><rect x="250" y="392" width="600" height="38" rx="4" fill="#ffffff" fill-opacity=".03"/><rect x="250" y="395" width="202.6" height="14" rx="3" fill="#64748b"/><text x="460.56" y="407" font-size="11.5" fill="#a3a9cc" font-weight="400" text-anchor="start">33.76%</text><rect x="250" y="413" width="259.4" height="14" rx="3" fill="#8b5cf6"/><text x="517.44" y="425" font-size="11.5" fill="#a3a9cc" font-weight="400" text-anchor="start">43.24%</text><line x1="560.2" y1="386" x2="560.2" y2="436" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="610.2" y="388" font-size="11" fill="#f59e0b" font-weight="400" text-anchor="start">Recall@100 = 51.7%, the ceiling for any reranker</text><text x="890" y="418" font-size="20" fill="#8b5cf6" font-weight="700" text-anchor="start">+9.5 pp</text><text x="64" y="472" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">F1</text><text x="64" y="490" font-size="12" fill="#6f76a3" font-weight="400" text-anchor="start">verification</text><rect x="250" y="458" width="600" height="38" rx="4" fill="#ffffff" fill-opacity=".03"/><rect x="250" y="461" width="330.0" height="14" rx="3" fill="#64748b"/><text x="588.0" y="473" font-size="11.5" fill="#a3a9cc" font-weight="400" text-anchor="start">55%</text><rect x="250" y="479" width="342.0" height="14" rx="3" fill="#8b5cf6"/><text x="600.0" y="491" font-size="11.5" fill="#a3a9cc" font-weight="400" text-anchor="start">57%</text><text x="890" y="484" font-size="20" fill="#a3a9cc" font-weight="700" text-anchor="start">+2 pp</text><text x="64" y="538" font-size="15" fill="#e8eaf6" font-weight="700" text-anchor="start">Accuracy</text><text x="64" y="556" font-size="12" fill="#6f76a3" font-weight="400" text-anchor="start">verification</text><rect x="250" y="524" width="600" height="38" rx="4" fill="#ffffff" fill-opacity=".03"/><rect x="250" y="527" width="312.0" height="14" rx="3" fill="#64748b"/><text x="570.0" y="539" font-size="11.5" fill="#a3a9cc" font-weight="400" text-anchor="start">52%</text><rect x="250" y="545" width="315.0" height="14" rx="3" fill="#8b5cf6"/><text x="573.0" y="557" font-size="11.5" fill="#a3a9cc" font-weight="400" text-anchor="start">52.5%</text><line x1="550.0" y1="518" x2="550.0" y2="568" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="600.0" y="574" font-size="11" fill="#f59e0b" font-weight="400" text-anchor="start">chance on balanced labels</text><text x="890" y="550" font-size="20" fill="#a3a9cc" font-weight="700" text-anchor="start">+0.5 pp</text><text x="40" y="626" font-size="13" fill="#a3a9cc" font-weight="400" text-anchor="start" font-style="italic">Reranking lifted retrieval recall by 9.5 points, but verification stayed near chance, so the NLI step, not retrieval, is the bottleneck.</text></svg>